<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TeenConnect - Chat</title>

    <script src="/socket.io/socket.io.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f0ff;
        }

        header {
            background: #6c4ab6;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: white;
            padding: 12px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        nav a {
            text-decoration: none;
            color: #5b3aa4;
            margin: 0 10px;
            font-weight: bold;
        }

        .badge {
            background: red;
            color: white;
            border-radius: 50%;
            padding: 3px 7px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 3px;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        #messages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background: #fafafa;
            margin-bottom: 15px;
        }

        .message {
            padding: 8px 12px;
            margin: 8px 0;
            background: #eee8ff;
            border-radius: 8px;
        }

        .message strong {
            color: #5b3aa4;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            background: #6c4ab6;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #563596;
        }
    </style>
</head>

<body>

<header>
    <h1>💬 TeenConnect Chat</h1>
</header>

<nav>

    <a href="/index.html">🏠 Home</a>

    <a href="/users.html">👥 Users</a>

    <a href="/friends.html">
        👥 Friends
        <span id="friendBadge"
              class="badge"
              style="display:none;"></span>
    </a>

    <a href="/chat.html">💬 Chat</a>

    <a href="/notifications.html">
        🔔 Notifications
        <span id="notificationBadge"
              class="badge"
              style="display:none;"></span>
    </a>

    <a href="/profile.html">👤 Profile</a>

    <a href="#" onclick="logout()">🚪 Logout</a>

</nav>


<div class="container">

    <h2>Public Chat</h2>

    <div id="messages"></div>

    <div class="input-area">

        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
            autocomplete="off"
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>


<script>

const currentUser =
    localStorage.getItem("username");

if (!currentUser) {

    window.location.href =
        "/login.html";

}


/* =========================
   SOCKET.IO
========================= */

const socket = io();

socket.emit(
    "register user",
    currentUser
);


/* =========================
   NOTIFICATIONS
========================= */

function getNotifications() {

    const key =
        "notifications_" +
        currentUser;

    try {

        return JSON.parse(
            localStorage.getItem(key)
        ) || [];

    } catch (error) {

        return [];

    }

}


function saveNotifications(
    notifications
) {

    const key =
        "notifications_" +
        currentUser;

    localStorage.setItem(
        key,
        JSON.stringify(notifications)
    );

}


function updateNotificationBadge() {

    const notifications =
        getNotifications();

    const unreadCount =
        notifications.filter(
            notification =>
                notification.read !== true
        ).length;

    const badge =
        document.getElementById(
            "notificationBadge"
        );

    if (unreadCount > 0) {

        badge.textContent =
            unreadCount;

        badge.style.display =
            "inline-block";

    } else {

        badge.style.display =
            "none";

    }

}


function saveNotification(
    message,
    link
) {

    const notifications =
        getNotifications();

    notifications.unshift({

        message: message,

        link: link,

        time:
            new Date().toLocaleString(),

        read: false

    });

    saveNotifications(
        notifications
    );

    updateNotificationBadge();

}


/* =========================
   FRIEND BADGE
========================= */

async function updateFriendBadge() {

    try {

        const response =
            await fetch(
                "/api/friend-requests?username=" +
                encodeURIComponent(currentUser)
            );

        const requests =
            await response.json();

        const badge =
            document.getElementById(
                "friendBadge"
            );

        if (requests.length > 0) {

            badge.textContent =
                requests.length;

            badge.style.display =
                "inline-block";

        } else {

            badge.style.display =
                "none";

        }

    } catch (error) {

        console.error(
            "Friend badge error:",
            error
        );

    }

}


/* =========================
   PUBLIC CHAT
========================= */

function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );

    const message =
        input.value.trim();

    if (!message) {
        return;
    }

    socket.emit(
        "chat message",
        {
            username: currentUser,
            message: message
        }
    );

    input.value = "";

}


socket.on(
    "chat message",
    function(data) {

        const messages =
            document.getElementById(
                "messages"
            );

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "message";

        const strong =
            document.createElement(
                "strong"
            );

        strong.textContent =
            data.username + ":";

        div.appendChild(strong);

        div.appendChild(
            document.createTextNode(
                " " + data.message
            )
        );

        messages.appendChild(div);

        messages.scrollTop =
            messages.scrollHeight;

    }
);


/* =========================
   ENTER TO SEND
========================= */

document.getElementById(
    "messageInput"
).addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);


/* =========================
   REAL-TIME FRIEND REQUEST
========================= */

socket.on(
    "friend request",
    function(data) {

        saveNotification(
            "👥 " + data.message,
            "/friends.html"
        );

        updateFriendBadge();

        alert(
            "👥 New friend request from " +
            data.sender
        );

    }
);


/* =========================
   FRIEND REQUEST ACCEPTED
========================= */

socket.on(
    "friend request accepted",
    function(data) {

        saveNotification(
            "✅ " + data.message,
            "/friends.html"
        );

        alert(
            "✅ " + data.message
        );

    }
);


/* =========================
   NEW PRIVATE MESSAGE
========================= */

socket.on(
    "new private message",
    function(data) {

        const sender =
            data.from ||
            data.sender;

        if (!sender) {
            return;
        }

        saveNotification(

            "💬 " +
            sender +
            " sent you a new message!",

            "/private-chat.html?username=" +
            encodeURIComponent(sender)

        );

        alert(
            "💬 New message from " +
            sender
        );

    }
);


/* =========================
   INITIAL LOAD
========================= */

updateFriendBadge();

updateNotificationBadge();


/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.removeItem(
        "username"
    );

    localStorage.removeItem(
        "aboutMe"
    );

    window.location.href =
        "/login.html";

}

</script>

</body>
<script src="/socket.io/socket.io.js"></script>
<script src="/notifications.js"></script>
</html>
