<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TeenConnect - Notifications</title>

    <script src="/socket.io/socket.io.js"></script>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5fb;
        }

        .header {
            background: #5b5ce2;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .nav {
            background: white;
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            flex-wrap: wrap;
        }

        .nav a,
        .logout {
            text-decoration: none;
            color: #5b5ce2;
            font-weight: bold;
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            background: white;
            cursor: pointer;
        }

        .nav a:hover {
            background: #eeeeff;
        }

        .logout {
            background: #777;
            color: white;
        }

        .badge {
            background: red;
            color: white;
            border-radius: 50%;
            padding: 3px 7px;
            font-size: 12px;
            margin-left: 3px;
            font-weight: bold;
            display: none;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            color: #5b5ce2;
            text-align: center;
        }

        .notification {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .notification:hover {
            transform: translateY(-2px);
        }

        .unread {
            background: #eeeeff;
            border-left: 5px solid #5b5ce2;
            font-weight: bold;
        }

        .read {
            background: #f5f5f5;
            border-left: 5px solid #ccc;
            color: #777;
        }

        .notification-message {
            font-size: 16px;
        }

        .notification-time {
            font-size: 12px;
            margin-top: 7px;
            color: #888;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .button {
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .read-button {
            background: #5b5ce2;
            color: white;
        }

        .clear-button {
            background: #d9534f;
            color: white;
        }

        .button:hover {
            opacity: 0.9;
        }

    </style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <h1>
        🔔 Notifications
    </h1>

</div>


<!-- NAVIGATION -->

<div class="nav">

    <a href="/index.html">
        🏠 Home
    </a>

    <a href="/users.html">
        👥 Users
    </a>

    <a href="/friends.html">
        👥 Friends
    </a>

    <a href="/chat.html">
        💬 Chat
    </a>

    <a href="/notifications.html">

        🔔 Notifications

        <span
            id="notificationBadge"
            class="badge"
        >
            0
        </span>

    </a>

    <a href="/profile.html">
        👤 Profile
    </a>

    <button
        class="logout"
        onclick="logout()"
    >
        🚪 Logout
    </button>

</div>


<!-- MAIN -->

<div class="container">

    <div class="box">

        <h2>
            Your Notifications
        </h2>


        <div class="buttons">

            <button
                class="button read-button"
                onclick="markAllAsRead()"
            >
                ✅ Mark All as Read
            </button>


            <button
                class="button clear-button"
                onclick="clearNotifications()"
            >
                🗑️ Clear All
            </button>

        </div>


        <div id="notificationList"></div>

    </div>

</div>


<script>


// ==========================================
// LOGIN
// ==========================================

const currentUser =
    localStorage.getItem("username");


if (!currentUser) {

    window.location.href =
        "/login.html";

}


// ==========================================
// SOCKET.IO
// ==========================================

const socket = io();


socket.emit(
    "register user",
    currentUser
);


// ==========================================
// STORAGE
// ==========================================

const notificationKey =
    "notifications_" +
    currentUser;


// ==========================================
// GET NOTIFICATIONS
// ==========================================

function getNotifications() {

    try {

        return JSON.parse(
            localStorage.getItem(
                notificationKey
            )
        ) || [];

    } catch (error) {

        return [];

    }

}


// ==========================================
// SAVE NOTIFICATIONS
// ==========================================

function saveNotifications(
    notifications
) {

    localStorage.setItem(
        notificationKey,
        JSON.stringify(
            notifications
        )
    );

}


// ==========================================
// UPDATE BADGE
// ==========================================

function updateNotificationBadge() {

    const notifications =
        getNotifications();


    const unreadCount =
        notifications.filter(
            function(notification) {

                return notification.read !== true;

            }
        ).length;


    const badge =
        document.getElementById(
            "notificationBadge"
        );


    if (unreadCount > 0) {

        badge.textContent =
            unreadCount;

        badge.style.display =
            "inline-block";

    } else {

        badge.textContent = "";

        badge.style.display =
            "none";

    }

}


// ==========================================
// SAVE NEW NOTIFICATION
// ==========================================

function saveNotification(
    message,
    link
) {

    const notifications =
        getNotifications();


    notifications.unshift({

        message:
            message,

        link:
            link,

        time:
            new Date().toLocaleString(),

        read:
            false

    });


    saveNotifications(
        notifications
    );


    loadNotifications();

}


// ==========================================
// LOAD NOTIFICATIONS
// ==========================================

function loadNotifications() {

    const list =
        document.getElementById(
            "notificationList"
        );


    const notifications =
        getNotifications();


    list.innerHTML = "";


    if (
        notifications.length === 0
    ) {

        list.innerHTML = `

            <div class="empty">

                🔔 No notifications yet.

            </div>

        `;

        updateNotificationBadge();

        return;

    }


    notifications.forEach(
        function(
            notification,
            index
        ) {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "notification " +
                (
                    notification.read === true
                        ? "read"
                        : "unread"
                );


            const messageDiv =
                document.createElement(
                    "div"
                );


            messageDiv.className =
                "notification-message";


            messageDiv.textContent =
                notification.message;


            const timeDiv =
                document.createElement(
                    "div"
                );


            timeDiv.className =
                "notification-time";


            timeDiv.textContent =
                notification.time +
                (
                    notification.read === true
                        ? " · Read"
                        : " · Unread"
                );


            div.appendChild(
                messageDiv
            );


            div.appendChild(
                timeDiv
            );


            div.onclick =
                function() {

                    openNotification(
                        index
                    );

                };


            list.appendChild(
                div
            );

        }
    );


    updateNotificationBadge();

}


// ==========================================
// OPEN NOTIFICATION
// ==========================================

function openNotification(index) {

    const notifications =
        getNotifications();


    if (
        !notifications[index]
    ) {

        return;

    }


    // Mark this notification as read

    notifications[index].read =
        true;


    const link =
        notifications[index].link;


    saveNotifications(
        notifications
    );


    updateNotificationBadge();


    loadNotifications();


    // Small delay makes the read state
    // save before changing page.

    if (link) {

        setTimeout(
            function() {

                window.location.href =
                    link;

            },
            100
        );

    }

}


// ==========================================
// MARK ALL AS READ
// ==========================================

function markAllAsRead() {

    const notifications =
        getNotifications();


    notifications.forEach(
        function(notification) {

            notification.read =
                true;

        }
    );


    saveNotifications(
        notifications
    );


    loadNotifications();


    updateNotificationBadge();

}


// ==========================================
// CLEAR ALL
// ==========================================

function clearNotifications() {

    const confirmed =
        confirm(
            "Are you sure you want to clear all notifications?"
        );


    if (!confirmed) {

        return;

    }


    localStorage.removeItem(
        notificationKey
    );


    loadNotifications();


    updateNotificationBadge();

}


// ==========================================
// FRIEND REQUEST
// ==========================================

socket.on(
    "friend request",
    function(data) {

        saveNotification(

            "👥 " +
            data.message,

            "/friends.html"

        );


        alert(
            "👥 " +
            data.message
        );

    }
);


// ==========================================
// FRIEND REQUEST ACCEPTED
// ==========================================

socket.on(
    "friend request accepted",
    function(data) {

        saveNotification(

            "✅ " +
            data.message,

            "/friends.html"

        );


        alert(
            "✅ " +
            data.message
        );

    }
);


// ==========================================
// NEW PRIVATE MESSAGE
// ==========================================

socket.on(
    "new private message",
    function(data) {

        const sender =
            data.from ||
            data.sender;


        if (!sender) {

            return;

        }


        saveNotification(

            "💬 " +
            sender +
            " sent you a new message!",

            "/private-chat.html?username=" +
            encodeURIComponent(
                sender
            )

        );


        alert(
            "💬 " +
            sender +
            " sent you a new message!"
        );

    }
);


// ==========================================
// LOGOUT
// ==========================================

function logout() {

    localStorage.removeItem(
        "username"
    );


    localStorage.removeItem(
        "aboutMe"
    );


    window.location.href =
        "/login.html";

}


// ==========================================
// START
// ==========================================

loadNotifications();

updateNotificationBadge();


</script>


</body>
<script src="/socket.io/socket.io.js"></script>
<script src="/notifications.js"></script>

</html>
