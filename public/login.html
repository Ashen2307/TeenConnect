<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TeenConnect - Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #5b5ce2;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #5b5ce2;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #4849c9;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>TeenConnect</h1>

        <h2>Login</h2>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const username =
                    document.getElementById("username").value.trim();

                const password =
                    document.getElementById("password").value;

                try {

                    const response = await fetch("/api/login", {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    });

                    const data = await response.json();

                    document.getElementById("message")
                        .textContent = data.message;

                    if (response.ok) {

                        localStorage.setItem(
                            "username",
                            username
                        );

                        setTimeout(function() {
                            window.location.href = "/chat.html";
                        }, 500);
                    }

                } catch (error) {

                    document.getElementById("message")
                        .textContent =
                        "Could not connect to the server.";

                }

            });

    </script>

</body>
</html>
