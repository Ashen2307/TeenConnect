<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TeenConnect - Profile</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f0ff;
        }


        nav {
            background: #6c4cff;
            padding: 14px;
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }


        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }


        nav a:hover {
            text-decoration: underline;
        }


        .container {
            width: 90%;
            max-width: 650px;
            margin: 35px auto;
        }


        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.12);
            text-align: center;
        }


        .profile-image {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #6c4cff;
            display: block;
            margin: 0 auto 15px;
        }


        .picture-button {
            display: inline-block;
            background: #eee8ff;
            color: #5b3fd1;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 15px;
        }


        #pictureInput {
            display: none;
        }


        h1 {
            margin: 10px 0;
            color: #333;
        }


        .status {
            color: #18a558;
            font-weight: bold;
            margin: 8px;
        }


        .friends-count {
            color: #555;
            margin-bottom: 25px;
        }


        .section-title {
            text-align: left;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }


        textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            resize: vertical;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }


        button {
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            margin: 10px 5px 0;
            font-weight: bold;
            cursor: pointer;
        }


        .save-button {
            background: #6c4cff;
            color: white;
        }


        .friends-button {
            background: #eee8ff;
            color: #5b3fd1;
        }


        button:hover {
            opacity: 0.9;
        }


        #message {
            margin-top: 15px;
            font-weight: bold;
            min-height: 24px;
        }

    </style>

</head>


<body>


    <!-- =========================
         NAVIGATION
    ========================= -->

    <nav>

        <a href="/index.html">
            🏠 Home
        </a>

        <a href="/users.html">
            👥 Users
        </a>

        <a href="/friends.html">
            👥 Friends
        </a>

        <a href="/chat.html">
            💬 Chat
        </a>

        <a href="/notifications.html">
            🔔 Notifications
        </a>

        <a href="/profile.html">
            👤 Profile
        </a>

        <a
            href="#"
            onclick="logout()"
        >
            🚪 Logout
        </a>

    </nav>


    <!-- =========================
         PROFILE
    ========================= -->

    <div class="container">

        <div class="profile-card">


            <img
                id="profileImage"
                class="profile-image"
                src=""
                alt="Profile picture"
            >


            <label
                class="picture-button"
                for="pictureInput"
            >
                🖼️ Change Profile Picture
            </label>


            <input
                type="file"
                id="pictureInput"
                accept="image/*"
            >


            <h1 id="username">
                Loading...
            </h1>


            <div
                class="status"
                id="status"
            >
                🟢 Online
            </div>


            <div class="friends-count">

                <strong id="friendCount">
                    0
                </strong>

                Friends

            </div>


            <div class="section-title">
                📝 About Me
            </div>


            <textarea
                id="aboutMe"
                placeholder="Tell people something about yourself..."
            ></textarea>


            <div>

                <button
                    class="save-button"
                    onclick="saveProfile()"
                >
                    💾 Save Profile
                </button>


                <button
                    class="friends-button"
                    onclick="location.href='/friends.html'"
                >
                    👥 My Friends
                </button>

            </div>


            <div id="message"></div>


        </div>

    </div>


    <!-- =========================
         SOCKET.IO
    ========================= -->

    <script src="/socket.io/socket.io.js"></script>


    <!-- =========================
         GLOBAL NOTIFICATIONS
    ========================= -->

    <script src="/notifications.js"></script>


    <!-- =========================
         PROFILE JAVASCRIPT
    ========================= -->

    <script>

        const currentUsername =
            localStorage.getItem("username");


        let avatar = "";


        /* =========================
           DEFAULT AVATAR
        ========================= */

        const defaultAvatar =
            "data:image/svg+xml;charset=UTF-8," +
            encodeURIComponent(`

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="200"
                    height="200"
                    viewBox="0 0 200 200"
                >

                    <circle
                        cx="100"
                        cy="100"
                        r="100"
                        fill="#ddd"
                    />

                    <circle
                        cx="100"
                        cy="78"
                        r="35"
                        fill="#888"
                    />

                    <path
                        d="M40 175
                           C45 125
                           155 125
                           160 175"
                        fill="#888"
                    />

                </svg>

            `);


        /* =========================
           LOGIN CHECK
        ========================= */

        if (!currentUsername) {

            window.location.href =
                "/login.html";

        }


        /* =========================
           LOAD PROFILE
        ========================= */

        async function loadProfile() {

            try {

                const response =
                    await fetch(
                        "/api/profile/" +
                        encodeURIComponent(
                            currentUsername
                        )
                    );


                const text =
                    await response.text();


                console.log(
                    "Profile response:",
                    text
                );


                if (!response.ok) {

                    throw new Error(
                        "Profile request failed"
                    );

                }


                const data =
                    JSON.parse(text);


                if (!data.success) {

                    throw new Error(
                        data.message ||
                        "Could not load profile"
                    );

                }


                document.getElementById(
                    "username"
                ).textContent =
                    data.username;


                document.getElementById(
                    "aboutMe"
                ).value =
                    data.aboutMe || "";


                avatar =
                    data.avatar || "";


                document.getElementById(
                    "profileImage"
                ).src =
                    avatar ||
                    defaultAvatar;


                loadFriendCount();

            }

            catch (error) {

                console.error(
                    "Load profile error:",
                    error
                );


                showMessage(
                    "❌ Could not load profile.",
                    true
                );

            }

        }


        /* =========================
           SAVE PROFILE
        ========================= */

        async function saveProfile() {

            const aboutMe =
                document.getElementById(
                    "aboutMe"
                ).value;


            const message =
                document.getElementById(
                    "message"
                );


            message.textContent =
                "Saving...";


            message.style.color =
                "#6c4cff";


            try {

                const response =
                    await fetch(
                        "/api/profile/update",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    username:
                                        currentUsername,

                                    avatar:
                                        avatar,

                                    aboutMe:
                                        aboutMe

                                })

                        }
                    );


                const text =
                    await response.text();


                console.log(
                    "SAVE PROFILE STATUS:",
                    response.status
                );


                console.log(
                    "SAVE PROFILE RESPONSE:",
                    text
                );


                if (!response.ok) {

                    throw new Error(
                        "Server returned HTTP " +
                        response.status +
                        ": " +
                        text
                    );

                }


                let data;


                try {

                    data =
                        JSON.parse(text);

                }

                catch (error) {

                    throw new Error(
                        "Server returned invalid JSON: " +
                        text
                    );

                }


                if (!data.success) {

                    throw new Error(
                        data.message ||
                        "Profile update failed"
                    );

                }


                message.textContent =
                    "✅ " +
                    data.message;


                message.style.color =
                    "#18a558";


                setTimeout(
                    function () {

                        message.textContent = "";

                    },
                    3000
                );

            }

            catch (error) {

                console.error(
                    "Save profile error:",
                    error
                );


                message.textContent =
                    "❌ " +
                    error.message;


                message.style.color =
                    "#d93025";

            }

        }


        /* =========================
           PROFILE PICTURE
        ========================= */

        document
            .getElementById("pictureInput")
            .addEventListener(
                "change",
                function () {

                    const file =
                        this.files[0];


                    if (!file) {

                        return;

                    }


                    if (
                        file.size >
                        2 * 1024 * 1024
                    ) {

                        showMessage(
                            "❌ Image must be smaller than 2 MB.",
                            true
                        );


                        this.value =
                            "";


                        return;

                    }


                    const reader =
                        new FileReader();


                    reader.onload =
                        function (event) {

                            avatar =
                                event.target.result;


                            document
                                .getElementById(
                                    "profileImage"
                                )
                                .src =
                                avatar;

                        };


                    reader.readAsDataURL(file);

                }
            );


        /* =========================
           FRIEND COUNT
        ========================= */

        async function loadFriendCount() {

            try {

                const response =
                    await fetch(
                        "/api/friends?username=" +
                        encodeURIComponent(
                            currentUsername
                        )
                    );


                const friends =
                    await response.json();


                if (
                    Array.isArray(friends)
                ) {

                    document
                        .getElementById(
                            "friendCount"
                        )
                        .textContent =
                        friends.length;

                }

            }

            catch (error) {

                console.error(
                    "Friend count error:",
                    error
                );

            }

        }


        /* =========================
           MESSAGE
        ========================= */

        function showMessage(
            text,
            isError = false
        ) {

            const message =
                document.getElementById(
                    "message"
                );


            message.textContent =
                text;


            message.style.color =
                isError
                    ? "#d93025"
                    : "#18a558";

        }


        /* =========================
           ONLINE STATUS
        ========================= */

        const socket =
            io();


        socket.emit(
            "register user",
            currentUsername
        );


        socket.on(
            "online users",
            function (users) {

                const status =
                    document.getElementById(
                        "status"
                    );


                if (
                    users.includes(
                        currentUsername
                    )
                ) {

                    status.textContent =
                        "🟢 Online";

                }

                else {

                    status.textContent =
                        "⚫ Offline";

                }

            }
        );


        /* =========================
           LOGOUT
        ========================= */

        function logout() {

            localStorage.removeItem(
                "username"
            );


            window.location.href =
                "/login.html";

        }


        /* =========================
           START
        ========================= */

        loadProfile();

    </script>

</body>

</html>
